name: Feature request
description: Suggest an improvement or a new capability for Gantry.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. For large features or architectural changes, open this issue before writing code so the approach can be discussed.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow or limitation that prompted this request.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should Gantry do, and where does it fit in the app?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, existing workarounds, or why they are not enough.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Conversation and streaming
        - Permissions
        - Providers and Keychain
        - Code-host plugins and MCP bridge
        - Sessions and persistence
        - UI and appearance
        - Build and packaging
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples from other tools, or related issues.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I understand large changes should be discussed with a maintainer before implementation.
          required: true
