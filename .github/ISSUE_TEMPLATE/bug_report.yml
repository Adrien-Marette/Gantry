name: Bug report
description: Report a reproducible problem in Gantry.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search existing issues first, and **redact API keys, tokens, and private paths** from logs and screenshots.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error text or result if there is one.
    validations:
      required: true

  - type: input
    id: gantry-version
    attributes:
      label: Gantry version or commit
      placeholder: "0.2.0, or the output of `git rev-parse --short HEAD`"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "26.1 (25B78)"
    validations:
      required: true

  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
    validations:
      required: true

  - type: input
    id: swift-version
    attributes:
      label: Xcode / Swift version
      description: The output of `swift --version`.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Conversation and streaming
        - Permissions
        - Providers and Keychain
        - Code-host plugins and MCP bridge
        - Sessions and persistence
        - UI and appearance
        - Build and packaging
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste logs in a code block. Remove credentials and personal data first.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed API keys, tokens, and other secrets from logs and screenshots.
          required: true
